name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v3.0.2)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x client/gradlew

      - name: Build Android APK
        run: |
          cd client
          ./gradlew assembleDebug --build-cache --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: client/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows Setup EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop-gui/package-lock.json

      - name: Install Desktop GUI Dependencies
        run: |
          cd desktop-gui
          npm ci

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Compile Windows Setup Installer
        run: |
          python build_exe.py --clean --max-compression

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: Remote_PC_Setup.exe
          if-no-files-found: error

  publish:
    name: Publish Release & Checksums
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Download Windows Setup
        uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: release-assets

      - name: Rename and compute checksums
        run: |
          cd release-assets
          if [ -f "app-debug.apk" ]; then
            mv "app-debug.apk" "Remote.PC.apk"
          fi

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"

          EXE_SIZE=$(stat -c%s "Remote_PC_Setup.exe")
          EXE_SHA512=$(sha512sum "Remote_PC_Setup.exe" | awk '{print $1}' | xxd -r -p | base64)

          cat <<EOF > latest.yml
          version: ${VERSION}
          files:
            - url: Remote_PC_Setup.exe
              sha512: ${EXE_SHA512}
              size: ${EXE_SIZE}
          path: Remote_PC_Setup.exe
          sha512: ${EXE_SHA512}
          releaseDate: '$(date -u +"%Y-%m-%dT%H:%M:%SZ")'
          EOF

          sha256sum Remote_PC_Setup.exe Remote.PC.apk > checksums.txt

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-assets/Remote_PC_Setup.exe
            release-assets/Remote.PC.apk
            release-assets/latest.yml
            release-assets/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
